name: DGMA Exam & Oral Meeting Monitor

on:
  schedule:
    # Runs every hour at 00 minutes UTC (Adjust cron as needed)
    - cron: '0 * * * '
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  check-dgma:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f src/requirements.txt ]; then
            pip install -r src/requirements.txt
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No requirements.txt found, installing default packages..."
            pip install requests python-dotenv beautifulsoup4
          fi

      - name: Run DGMA Monitor Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          DGMA_USERNAME: ${{ secrets.DGMA_USERNAME }}
          DGMA_PASSWORD: ${{ secrets.DGMA_PASSWORD }}
          GAS_ENDPOINT: ${{ secrets.GAS_ENDPOINT }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          if [ -f src/dgma_bot.py ]; then
            python src/dgma_bot.py
          elif [ -f dgma_bot.py ]; then
            python dgma_bot.py
          else
            echo "Error: dgma_bot.py script not found!"
            exit 1
          fi
