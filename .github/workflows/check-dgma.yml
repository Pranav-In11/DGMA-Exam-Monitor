name: DGMA Exam Monitor

on:
  schedule:
    # Run every hour
    - cron: '0 * * * *'

  # Allow manual trigger
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt

      - name: Run DGMA Monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          DGMA_USERNAME: ${{ secrets.DGMA_USERNAME }}
          DGMA_PASSWORD: ${{ secrets.DGMA_PASSWORD }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          python src/dgma_bot.py

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: bot-logs
          path: dgma_bot.log
          retention-days: 7
